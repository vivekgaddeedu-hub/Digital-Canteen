name: Docker Build & Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
  workflow_dispatch:

jobs:
  docker-build:
    name: Build & Smoke Test Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Smoke Test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: quickbite:test-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Container Startup & Smoke Test
        run: |
          docker run --rm -d --name quickbite-smoke -p 3000:3000 \
            -e DATABASE_URL="postgresql://mock:mock@localhost:5432/mock" \
            -e JWT_SECRET="smoke_test_secret_for_docker_container" \
            quickbite:test-${{ github.sha }}
          sleep 5
          docker ps | grep quickbite-smoke || (docker logs quickbite-smoke && exit 1)
          docker stop quickbite-smoke
